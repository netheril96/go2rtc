<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>webrtc - go2rtc</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        video {
            flex: 1;
            width: 100%;
            object-fit: contain;
        }

        .ptz {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            justify-content: center;
            padding: 10px;
        }

        .ptz > button {
            height: 40px;
            cursor: pointer;
            font-size: 20px;
        }
    </style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div class="ptz">
    <button style="grid-column: 2" onclick="ptz(0, 0.1, 0)">▲</button>
    <button style="grid-column: 1; grid-row: 2" onclick="ptz(-0.05, 0, 0)">◀</button>
    <button style="grid-column: 2; grid-row: 2" onclick="ptz(0, -0.1, 0)">▼</button>
    <button style="grid-column: 3; grid-row: 2" onclick="ptz(0.05, 0, 0)">▶</button>
</div>
<script>
        function ptz(p, t, z) {
            const src = new URLSearchParams(location.search).get('src');
            fetch('api/ptz', {
                method: 'POST',
                body: JSON.stringify({ name: src, p: p, t: t, z: z })
            });
        }

    async function PeerConnection(media) {
        let iceServers = localStorage.getItem('iceServers');
        if (!iceServers) {
            const defaults = '[{"urls":["stun:"]}]';
            iceServers = prompt('ICE servers', defaults);
            if (iceServers) {
                localStorage.setItem('iceServers', iceServers);
            } else {
                iceServers = defaults;
            }
        }

        const pc = new RTCPeerConnection({ iceServers: JSON.parse(iceServers) });

        const localTracks = [];

        if (/camera|microphone/.test(media)) {
            const tracks = await getMediaTracks('user', {
                video: media.indexOf('camera') >= 0,
                audio: media.indexOf('microphone') >= 0,
            });
            tracks.forEach(track => {
                pc.addTransceiver(track, {direction: 'sendonly'});
                if (track.kind === 'video') localTracks.push(track);
            });
        }

        if (media.indexOf('display') >= 0) {
            const tracks = await getMediaTracks('display', {
                video: true,
                audio: media.indexOf('speaker') >= 0,
            });
            tracks.forEach(track => {
                pc.addTransceiver(track, {direction: 'sendonly'});
                if (track.kind === 'video') localTracks.push(track);
            });
        }

        if (/video|audio/.test(media)) {
            const tracks = ['video', 'audio']
                .filter(kind => media.indexOf(kind) >= 0)
                .map(kind => pc.addTransceiver(kind, {direction: 'recvonly'}).receiver.track);
            localTracks.push(...tracks);
        }

        document.getElementById('video').srcObject = new MediaStream(localTracks);

        return pc;
    }

    async function getMediaTracks(media, constraints) {
        try {
            const stream = media === 'user'
                ? await navigator.mediaDevices.getUserMedia(constraints)
                : await navigator.mediaDevices.getDisplayMedia(constraints);
            return stream.getTracks();
        } catch (e) {
            console.warn(e);
            return [];
        }
    }

    async function connect(media) {
        const pc = await PeerConnection(media);
        const url = new URL('api/ws' + location.search, location.href);
        const ws = new WebSocket('ws' + url.toString().substring(4));

        ws.addEventListener('open', () => {
            pc.addEventListener('icecandidate', ev => {
                if (!ev.candidate) return;
                const msg = {type: 'webrtc/candidate', value: ev.candidate.candidate};
                ws.send(JSON.stringify(msg));
            });

            pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
                const msg = {type: 'webrtc/offer', value: pc.localDescription.sdp};
                ws.send(JSON.stringify(msg));
            });
        });

        ws.addEventListener('message', ev => {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'webrtc/candidate') {
                pc.addIceCandidate({candidate: msg.value, sdpMid: '0'});
            } else if (msg.type === 'webrtc/answer') {
                pc.setRemoteDescription({type: 'answer', sdp: msg.value});
            }
        });
    }

    const media = new URLSearchParams(location.search).get('media');
    connect(media || 'video+audio');
</script>
</body>
</html>
